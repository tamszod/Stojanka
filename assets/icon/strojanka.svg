<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Strojanka icon. Keep in sync with tools/make_icons.ps1, which draws the same shapes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)"/>
  <!-- resistance and support levels -->
  <line x1="16" y1="27" x2="84" y2="27" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="16" y1="64" x2="84" y2="64" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- price swings -->
  <polyline points="17,74 37,38 55,64 79,27" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- SUPPORT (buy) and PEAK (sell) -->
  <circle cx="55" cy="64" r="7.5" fill="#34D399" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="79" cy="27" r="7.5" fill="#FBBF24" stroke="#FFFFFF" stroke-width="3"/>
</svg>
